[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidenceiq"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3", "sqlalchemy[asyncio]>=2.0,<3", "alembic>=1.13,<2",
  "aiosqlite>=0.20,<1", "python-multipart>=0.0.9,<1", "httpx>=0.27,<1",
  "pypdf>=5,<7", "pytesseract>=0.3,<1", "Pillow>=10"
]
[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "asgi-lifespan>=2"]
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
